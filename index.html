<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>European Cup &amp; Champions League — Finalists Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #0b1220;
    --panel: #121a2b;
    --border: #22304a;
    --text: #e8edf7;
    --muted: #93a1bd;
    --gold: #d4af37;
    --silver: #b9c2cf;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app { display: flex; height: 100vh; }
  #map { flex: 1; background: #0b1220; }
  #sidebar {
    width: 340px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0 0 4px; }
  header p { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.4; }
  .legend {
    display: flex; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.gold { background: var(--gold); }
  .dot.silver { background: var(--silver); }
  #detail { padding: 18px; overflow-y: auto; flex: 1; }
  #detail .placeholder { color: var(--muted); font-size: 13px; }
  #detail h2 { margin: 0 0 2px; font-size: 18px; }
  #detail .country { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  #detail .stats { display: flex; gap: 16px; margin-bottom: 16px; }
  #detail .stat { text-align: center; }
  #detail .stat .n { font-size: 22px; font-weight: 700; }
  #detail .stat .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #detail ul { list-style: none; margin: 0; padding: 0; }
  #detail li {
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  #detail li .season { color: var(--muted); font-size: 11px; }
  #detail li .result { font-weight: 600; }
  #detail li .result.win { color: var(--gold); }
  #detail li .result.lose { color: var(--silver); }
  #detail li .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .leaflet-popup-content-wrapper { background: var(--panel); color: var(--text); }
  .leaflet-popup-tip { background: var(--panel); }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="sidebar">
    <header>
      <h1>🏆 European Cup &amp; Champions League</h1>
      <p>Every club that has reached a final, 1955–56 to present. Gold = won the title at least once. Silver = runner-up only. Click a marker to drill into a club's finals history.</p>
    </header>
    <div class="legend">
      <span><i class="dot gold"></i> Winner</span>
      <span><i class="dot silver"></i> Runner-up only</span>
    </div>
    <div id="detail"><p class="placeholder">Select a club on the map to see its full run of finals.</p></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map', { worldCopyJump: true }).setView([54, 15], 4);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 19,
  }).addTo(map);

  function markerFor(club) {
    const color = club.bestResult === 'Winner' ? '#d4af37' : '#b9c2cf';
    const radius = club.bestResult === 'Winner' ? 8 : 6;
    return L.circleMarker([club.lat, club.lon], {
      radius,
      color: '#0b1220',
      weight: 1,
      fillColor: color,
      fillOpacity: 0.95,
    });
  }

  function renderDetail(club) {
    const el = document.getElementById('detail');
    const rows = club.appearances.map(a => {
      const win = a.result === 'Winner';
      return `<li>
        <div class="season">${a.season}</div>
        <div class="result ${win ? 'win' : 'lose'}">${win ? '🏆 Winner' : '🥈 Runner-up'} — ${a.score}</div>
        <div class="meta">vs ${a.opponent} · ${a.venue}, ${a.city}</div>
      </li>`;
    }).join('');

    el.innerHTML = `
      <h2>${club.name}</h2>
      <div class="country">${club.country}</div>
      <div class="stats">
        <div class="stat"><div class="n">${club.titles}</div><div class="l">Titles</div></div>
        <div class="stat"><div class="n">${club.runnerUps}</div><div class="l">Runner-up</div></div>
        <div class="stat"><div class="n">${club.appearances.length}</div><div class="l">Finals</div></div>
      </div>
      <ul>${rows}</ul>
    `;
  }

  fetch('data/clubs.json')
    .then(r => r.json())
    .then(clubs => {
      clubs.sort((a, b) => (a.bestResult === 'Winner' ? 0 : 1) - (b.bestResult === 'Winner' ? 0 : 1));
      const points = [];
      clubs.forEach(club => {
        const m = markerFor(club).addTo(map);
        m.bindTooltip(`${club.name} — ${club.titles}× title${club.titles === 1 ? '' : 's'}, ${club.runnerUps}× runner-up`);
        m.on('click', () => renderDetail(club));
        points.push([club.lat, club.lon]);
      });
      if (points.length) {
        requestAnimationFrame(() => {
          map.invalidateSize();
          map.fitBounds(L.latLngBounds(points), { padding: [30, 30] });
        });
      }
    })
    .catch(err => {
      document.getElementById('detail').innerHTML =
        `<p class="placeholder">Could not load data/clubs.json (${err}). If you're opening this file directly, run it through a local server instead — browsers block fetch() on file:// URLs.</p>`;
    });
</script>
</body>
</html>
